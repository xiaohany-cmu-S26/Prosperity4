    // Price depth widget — y-axis key for product at sorted index i follows

    let applyingPriceDepth = false;

    function getPriceYAxisKey(sortedIndex) {
        return sortedIndex === 0 ? 'yaxis' : `yaxis${2 * sortedIndex + 1}`;
    }

    // depth=null → restore each product's natural (data-fitted) range
    function applyPriceDepth(depth) {
        const products = Object.keys(priceData).sort();
        if (!products.length) return;
        const update = {};
        products.forEach((product, i) => {
            const info = priceData[product];
            const half = (depth !== null ? depth : info.depth) / 2;
            const key = getPriceYAxisKey(i);
            update[`${key}.range`] = [info.center - half, info.center + half];
            update[`${key}.autorange`] = false;
        });
        applyingPriceDepth = true;
        Plotly.relayout(chart, update);
    }

    document.getElementById('priceDepthInput').addEventListener('change', function() {
        const depth = parseFloat(this.value);
        if (depth > 0) applyPriceDepth(depth);

    // Compute stats for a given timestamp range [tMin, tMax]
    function computeStats(tMin, tMax) {
        const ts = rawTs.timeseries || {};
        const trades = rawTs.trades || {};
        const products = Object.keys(ts).sort();

        let totalPnl = 0;
        let totalTrades = 0;
        let totalMyTrades = 0;
        const productStats = [];

        for (const product of products) {
            const d = ts[product];
            const timestamps = d.timestamps;
            const pnl = d.pnl;
            const inv = d.inventory;

            // Find indices within range
            let iStart = -1, iEnd = -1;
            for (let i = 0; i < timestamps.length; i++) {
                if (timestamps[i] >= tMin && iStart === -1) iStart = i;
                if (timestamps[i] <= tMax) iEnd = i;
            }

            let pnlInRange = 0;
            let invAtEnd = 0;
            if (iStart >= 0 && iEnd >= 0) {
                const startPnl = iStart > 0 ? pnl[iStart - 1] : 0;
                pnlInRange = pnl[iEnd] - startPnl;
                invAtEnd = inv[iEnd];
            }

            // Count trades in range
            const productTrades = trades[product] || [];
            let tradeCount = 0, myCount = 0, buyCount = 0, sellCount = 0;
            for (const t of productTrades) {
                if (t.t >= tMin && t.t <= tMax) {
                    tradeCount++;
                    if (t.side === 'buy') { myCount++; buyCount++; }
                    else if (t.side === 'sell') { myCount++; sellCount++; }
                }
            }

            totalPnl += pnlInRange;
            totalTrades += tradeCount;
            totalMyTrades += myCount;

            productStats.push({
                product, pnlInRange, invAtEnd,
                tradeCount, myCount, buyCount, sellCount
            });
        }

        return { totalPnl, totalTrades, totalMyTrades, productStats };
